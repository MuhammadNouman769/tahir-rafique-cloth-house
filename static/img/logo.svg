<svg width="280" height="72" viewBox="0 0 280 72" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tahir Rafique Cloth House">
  <defs>
    <linearGradient id="trchGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9b273"/>
      <stop offset="100%" stop-color="#96703f"/>
    </linearGradient>
  </defs>

  <!-- Monogram: hanger + TR interlock -->
  <g transform="translate(4,8)">
    <circle cx="28" cy="28" r="27" fill="none" stroke="url(#trchGold)" stroke-width="1.5"/>
    <!-- hanger hook -->
    <path d="M28 10 C28 14 25 14 25 17" fill="none" stroke="#1a1512" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="28" cy="9.2" r="1.6" fill="#1a1512"/>
    <!-- hanger body forming a T/R monogram silhouette -->
    <path d="M12 30 L28 18 L44 30 L38 30 L38 44 L18 44 L18 30 Z"
          fill="none" stroke="#1a1512" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M23 44 L23 34 L33 34 L33 44" fill="none" stroke="url(#trchGold)" stroke-width="1.6"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(68,20)">
    <text x="0" y="14" font-family="'Playfair Display', Georgia, serif" font-size="21"
          letter-spacing="0.5" fill="#1a1512" font-weight="700">TAHIR RAFIQUE</text>
    <text x="0" y="34" font-family="'Inter', Arial, sans-serif" font-size="11.5"
          letter-spacing="5.5" fill="#96703f" font-weight="600">CLOTH HOUSE</text>
    <line x1="0" y1="20" x2="196" y2="20" stroke="#e4dcd0" stroke-width="1"/>
  </g>
</svg>
